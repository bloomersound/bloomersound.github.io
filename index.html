<!--
This page redirects you to the site "bloomersound.com"
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bloomer🩵☁️</title>

    <meta
        name="description"
        content="An unofficial fan site dedicated to Bloomer (bloomersound), Sage Douglas, and his music aliases."
    >

    <style>
    /* =========================================================
       GEMINI'S ORIGINAL CSS
       ========================================================= */

    /* Base Styling & Reset */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Cinzel', 'Didot', 'Garamond', 'Times New Roman', serif;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background-color: #0b0f19;
        color: #ffffff;
        overflow-x: hidden;
    }

    /* Hero Banner Section */
    .hero {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: url('https://img.ngfiles.com/page_banners/7000/banner-6105.png?1785987561') no-repeat center center;
        background-size: cover;
        overflow: hidden;
    }

    /* Ambient subtle glow overlay */
    .hero::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            180deg,
            rgba(11, 15, 25, 0) 70%,
            rgba(11, 15, 25, 1) 100%
        );
        z-index: 2;
    }

    /* Original elegant text treatment */
    .hero h1 {
        font-size: clamp(4rem, 15vw, 12rem);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: rgba(255, 255, 255, 0.45);
        text-shadow: 0 0 40px rgba(114, 185, 243, 0.2);
        z-index: 3;
        pointer-events: none;
        user-select: none;
        text-align: center;
    }

    /* Content Sections Wrapper */
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 20px;
        position: relative;
        z-index: 3;
    }

    h2 {
        font-size: 2.5rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 40px;
        text-align: center;
        color: #b2d2f7;
        text-shadow: 0 0 15px rgba(178, 210, 247, 0.3);
    }

    /* Audio Music Section styling */
    .music-section {
        margin-bottom: 80px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 40px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .track-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .track-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 8px;
        border-left: 4px solid #72b9f3;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .track-item:hover {
        transform: translateX(5px);
        background: rgba(255, 255, 255, 0.05);
    }

    .track-info h3 {
        font-size: 1.2rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }

    .track-info p {
        font-size: 0.85rem;
        color: #8fa0ba;
    }

    audio {
        height: 36px;
        max-width: 300px;
    }

    /* Merch Store Grid Styling */
    .merch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
        margin-bottom: 40px;
    }

    .merch-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s ease;
    }

    .merch-card:hover {
        transform: translateY(-8px);
        border-color: rgba(114, 185, 243, 0.4);
        box-shadow: 0 10px 30px rgba(114, 185, 243, 0.1);
    }

    .merch-image-placeholder {
        width: 100%;
        height: 260px;
        background: linear-gradient(
            135deg,
            #162235 0%,
            #0b0f19 100%
        );
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #506684;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .merch-title {
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        margin-bottom: 10px;
    }

    .merch-link {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 24px;
        background: transparent;
        color: #72b9f3;
        border: 1px solid #72b9f3;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: all 0.2s ease;
    }

    .merch-link:hover {
        background: #72b9f3;
        color: #0b0f19;
        font-weight: bold;
    }

    .view-all-container {
        text-align: center;
        margin-top: 40px;
    }

    .btn-primary {
        display: inline-block;
        padding: 15px 40px;
        background: #72b9f3;
        color: #0b0f19;
        text-decoration: none;
        font-weight: bold;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        border-radius: 30px;
        box-shadow: 0 4px 20px rgba(114, 185, 243, 0.3);
        transition: all 0.2s ease;
    }

    .btn-primary:hover {
        background: #ffffff;
        box-shadow: 0 4px 25px rgba(255, 255, 255, 0.4);
        transform: scale(1.03);
    }

    /* Footer styling elements */
    footer {
        text-align: center;
        padding: 60px 20px;
        font-size: 0.85rem;
        color: #506684;
        letter-spacing: 0.05em;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        margin-top: 60px;
    }

    footer a {
        color: #72b9f3;
        text-decoration: none;
    }


    /* =========================================================
       NEW SITE STYLING
       ========================================================= */

    /* Floating Header
       Hidden until the user scrolls below the hero. */

    .site-header {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translate(-50%, -130%);
        width: min(94%, 1100px);
        z-index: 1000;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 14px 22px;

        background: rgba(11, 15, 25, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);

        opacity: 0;
        pointer-events: none;

        transition:
            transform 0.45s ease,
            opacity 0.35s ease;
    }

    .site-header.visible {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
    }

    .header-logo {
        color: #ffffff;
        text-decoration: none;
        font-size: 1.15rem;
        font-weight: bold;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .header-nav {
        display: flex;
        gap: 25px;
        align-items: center;
    }

    .header-nav a {
        color: #b2d2f7;
        text-decoration: none;
        font-size: 0.82rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: color 0.2s ease;
    }

    .header-nav a:hover {
        color: #ffffff;
    }


    /* Intro Notice */

    .fan-notice {
        max-width: 850px;
        margin: 0 auto 80px;
        padding: 30px;

        text-align: center;

        color: #8fa0ba;

        border-top: 1px solid rgba(114, 185, 243, 0.2);
        border-bottom: 1px solid rgba(114, 185, 243, 0.2);

        line-height: 1.8;
    }

    .fan-notice strong {
        color: #b2d2f7;
    }


    /* Section wrapper */

    .site-section {
        margin-bottom: 100px;
        scroll-margin-top: 100px;
    }

    .section-description {
        max-width: 720px;
        margin: -15px auto 35px;
        text-align: center;
        color: #71839f;
        line-height: 1.7;
        font-size: 0.95rem;
    }


    /* Alias Section */

    .alias-section {
        margin-bottom: 100px;
    }

    .alias-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .alias {
        padding: 12px 20px;

        border: 1px solid rgba(114, 185, 243, 0.22);
        border-radius: 999px;

        color: #b2d2f7;
        background: rgba(114, 185, 243, 0.04);

        letter-spacing: 0.08em;
        font-size: 0.85rem;

        transition: all 0.25s ease;
    }

    .alias:hover {
        background: rgba(114, 185, 243, 0.12);
        border-color: rgba(114, 185, 243, 0.5);
        transform: translateY(-2px);
    }


    /* Photo Archive */

    .photo-section {
        margin-bottom: 100px;
        scroll-margin-top: 100px;
    }

    .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 20px;
    }

    .photo-card {
        position: relative;
        overflow: hidden;

        min-height: 260px;

        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);

        background: #101827;

        transition:
            transform 0.3s ease,
            border-color 0.3s ease,
            box-shadow 0.3s ease;
    }

    .photo-card:hover {
        transform: translateY(-5px);
        border-color: rgba(114, 185, 243, 0.35);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .photo-card img {
        width: 100%;
        height: 280px;
        display: block;

        object-fit: cover;

        transition: transform 0.4s ease;
    }

    .photo-card:hover img {
        transform: scale(1.04);
    }

    .photo-overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;

        padding: 35px 15px 15px;

        background: linear-gradient(
            transparent,
            rgba(5, 8, 15, 0.95)
        );
    }

    .photo-year {
        font-size: 0.8rem;
        color: #b2d2f7;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
    }

    .photo-source {
        color: #71839f;
        font-size: 0.75rem;
    }

    .download-photo {
        display: inline-block;
        margin-top: 10px;

        color: #72b9f3;
        text-decoration: none;

        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .download-photo:hover {
        color: #ffffff;
    }


    /* Timeline / About */

    .timeline {
        max-width: 850px;
        margin: auto;
        border-left: 1px solid rgba(114, 185, 243, 0.3);
    }

    .timeline-item {
        position: relative;
        padding: 0 0 35px 30px;
    }

    .timeline-item::before {
        content: '';

        position: absolute;
        left: -5px;
        top: 5px;

        width: 9px;
        height: 9px;

        border-radius: 50%;
        background: #72b9f3;

        box-shadow: 0 0 15px rgba(114, 185, 243, 0.6);
    }

    .timeline-year {
        color: #72b9f3;
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        margin-bottom: 7px;
    }

    .timeline-item h3 {
        margin-bottom: 7px;
        font-size: 1.2rem;
    }

    .timeline-item p {
        color: #71839f;
        line-height: 1.7;
        font-family: Arial, sans-serif;
        font-size: 0.9rem;
    }


    /* Merch Embed */

    .merch-embed-wrapper {
        margin-top: 60px;
        display: none;
    }

    .merch-embed-wrapper.active {
        display: block;
    }

    .merch-embed {
        width: 100%;
        height: 750px;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;

        background: #ffffff;
    }

    .embed-warning {
        display: none;

        margin-top: 20px;
        padding: 20px;

        text-align: center;

        color: #8fa0ba;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
    }

    .embed-warning.active {
        display: block;
    }


    /* Scroll reveal */

    .reveal {
        opacity: 0;
        transform: translateY(25px);
        transition:
            opacity 0.7s ease,
            transform 0.7s ease;
    }

    .reveal.revealed {
        opacity: 1;
        transform: translateY(0);
    }


    /* Mobile */

    @media (max-width: 767px) {

        .site-header {
            padding: 13px 16px;
            border-radius: 15px;
        }

        .header-logo {
            font-size: 0.9rem;
        }

        .header-nav {
            gap: 12px;
        }

        .header-nav a {
            font-size: 0.65rem;
        }

        .hero h1 {
            letter-spacing: 0.08em;
        }

        .music-section {
            padding: 22px 15px;
        }

        .track-item {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        audio {
            width: 100%;
            max-width: none;
        }

        h2 {
            font-size: 1.8rem;
            letter-spacing: 0.12em;
        }

        .fan-notice {
            padding: 25px 15px;
        }

        .merch-image-placeholder {
            height: 220px;
        }

        .photo-grid {
            grid-template-columns: 1fr;
        }

        .photo-card img {
            height: 300px;
        }

        .btn-primary {
            padding: 13px 25px;
            font-size: 0.8rem;
        }
    }
    
    .track-button {
    display: inline-block;
    padding: 10px 20px;

    color: #72b9f3;
    background: transparent;

    border: 1px solid rgba(114, 185, 243, 0.5);
    border-radius: 999px;

    text-decoration: none;

    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
}

.track-button:hover {
    background: #72b9f3;
    color: #0b0f19;
    transform: translateY(-2px);
}
    </style>
</head>

<body>

    <!-- =====================================================

         Appears only after scrolling below the hero.

    <header class="site-header" id="siteHeader">

        <a href="#" class="header-logo">

        </a>

        <nav class="header-nav">
            <a href="#music">Music</a>
            <a href="#merch">Merch</a>
            <a href="#photos">Photos</a>
            <a href="#about">About</a>
        </nav>

    </header>


    <!-- =====================================================

    <section class="hero" id="hero">

        <h2>Redirecting to Bloomer🩵☁️ :)</h2>

    </section>
    

    <!-- =====================================================

    <footer>
        <p>

    </footer>

</body>
